name: Windows Desktop Build
permissions:
  contents: write
on:
  pull_request:
    paths:
      - "electron/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "scripts/offline-smoke.cjs"
      - ".github/workflows/windows-desktop-build.yml"
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "scripts/offline-smoke.cjs"
      - ".github/workflows/windows-desktop-build.yml"
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Restore Electron Builder download caches
        uses: actions/cache@v4
        with:
          path: |
            ~\\AppData\\Local\\electron-builder\\Cache
            ~\\AppData\\Local\\electron\\Cache
          key: electron-builder-windows-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-builder-windows-${{ runner.os }}-
      - name: Install dependencies
        run: bun install
      - name: Install Electron runtime binary
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if (-not (Test-Path '.\\node_modules\\electron\\dist\\electron.exe')) { throw 'Electron runtime binary missing after installation' }
      - name: Validate Electron JavaScript syntax
        shell: pwsh
        run: |
          foreach ($file in @("electron/main.cjs", "electron/preload.cjs", "electron/local-db.cjs")) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Invalid JavaScript syntax: $file" }
          }
      - name: Build Node HTTP server for Electron
        shell: pwsh
        env:
          NITRO_PRESET: node-server
        run: |
          bun run build
          if ($LASTEXITCODE -ne 0) { throw "Web build failed" }
          $entry = ".output/server/index.mjs"
          if (-not (Test-Path $entry)) { throw "Node server entry missing" }
          Write-Host "Node server entry exists: $entry (runtime startup will be verified after packaging)"
      - name: Rebuild native Electron dependencies
        run: bunx electron-builder install-app-deps
      - name: Run offline SQLite smoke test
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          & ".\\node_modules\\electron\\dist\\electron.exe" "scripts/offline-smoke.cjs"
      # Package the executable directory without NSIS. The NSIS/7zip upstream
      # asset endpoints repeatedly return HTTP 504 even after five retries.
      - name: Package Windows desktop without NSIS dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Electron directory packaging attempt $attempt of $maxAttempts"
            & bunx electron-builder --win --dir --publish never
            $code = $LASTEXITCODE
            if ($code -eq 0 -and (Test-Path 'release/win-unpacked/FH Traders.exe')) { break }
            if ($attempt -eq $maxAttempts) { throw "Windows directory packaging failed after $maxAttempts attempts (exit code $code)" }
            Start-Sleep -Seconds (15 * $attempt)
          }
      - name: Inspect packaged server files and launch diagnostics
        shell: pwsh
        run: |
          $root = Join-Path (Get-Location) "release/win-unpacked/resources"
          Write-Host "Resources:"
          Get-ChildItem $root | Select-Object FullName
          $entry = Join-Path $root "app.asar.unpacked/.output/server/index.mjs"
          Write-Host "Unpacked server entry exists: $(Test-Path $entry)"
          if (Test-Path $entry) {
            Write-Host "Server directory listing:"
            Get-ChildItem (Split-Path $entry) | Select-Object -First 15 Name
          }
          $asar = Join-Path $root "app.asar"
          if (Test-Path $asar) {
            Write-Host "ASAR bundled server listing:"
            bunx asar list $asar | Select-String "server/index.mjs|electron/main.cjs" | Select-Object -First 10
          }
      - name: Smoke test packaged desktop startup
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "release/win-unpacked/FH Traders.exe"
          if (-not (Test-Path $exe)) { throw "Packaged desktop executable not found: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw "Packaged desktop exited during startup (code $($proc.ExitCode))" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:32145" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Packaged desktop did not start its local web server within 45 seconds" }
            Write-Host "Packaged desktop process and local server started successfully."
          } finally {
            Write-Host "AppData diagnostic logs:"
            Get-ChildItem -Path $env:APPDATA -Filter desktop-server.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Tail 100 }
            $log = Join-Path $env:APPDATA "fhtraders/desktop-server.log"
            $other = Join-Path $env:APPDATA "FH Traders/desktop-server.log"
            foreach ($p in @($log, $other)) { if (Test-Path $p) { Write-Host "Server diagnostic log: $p"; Get-Content $p -Tail 100 } }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process | Where-Object { $_.Name -eq "FH Traders.exe" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - name: Create downloadable portable Windows desktop ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'release/win-unpacked/FH Traders.exe')) { throw 'Windows executable not found' }
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath 'release/FH-Traders-Windows-Portable.zip' -Force
          if (-not (Test-Path 'release/FH-Traders-Windows-Portable.zip')) { throw 'Portable ZIP missing' }
      - name: Build actual Windows Setup EXE using Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup compiler' }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $iss = @'
          [Setup]
          AppId={{DA4E43B2-BF6B-4C4E-A591-97B6B9A8D5FC}
          AppName=FH Traders
          AppVersion=1.0.1
          AppPublisher=FH Traders
          DefaultDirName={localappdata}\Programs\FH Traders
          DefaultGroupName=FH Traders
          OutputDir=release
          OutputBaseFilename=FH-Traders-Setup-1.0.1
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          UninstallDisplayIcon={app}\FH Traders.exe
          [Files]
          Source: "release\win-unpacked\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\FH Traders"; Filename: "{app}\FH Traders.exe"
          Name: "{autodesktop}\FH Traders"; Filename: "{app}\FH Traders.exe"; Tasks: desktopicon
          [Tasks]
          Name: desktopicon; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"
          [Run]
          Filename: "{app}\FH Traders.exe"; Description: "Launch FH Traders"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path 'fhtraders-installer.iss' -Value $iss -Encoding UTF8
          & $iscc 'fhtraders-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'release/FH-Traders-Setup-1.0.1.exe')) { throw 'Setup EXE not produced' }
          Get-Item 'release/FH-Traders-Setup-1.0.1.exe' | Select-Object Name,Length
      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v4
        with:
          name: fh-traders-windows
          path: |
            release/FH-Traders-Windows-Portable.zip
            release/FH-Traders-Setup-1.0.1.exe
          if-no-files-found: error
      - name: Publish portable ZIP and Windows Setup EXE to public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $file = 'release/FH-Traders-Windows-Portable.zip'
          if (-not (Test-Path $file)) { throw 'Portable desktop ZIP not found' }
          gh release view desktop-latest --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-latest --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "FH Traders Desktop - Latest Windows Package" --notes "Portable Windows package. Extract all files, then run FH Traders.exe. Verify offline sync before live transactions." --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create desktop release' }
          }
          gh release upload desktop-latest $file 'release/FH-Traders-Setup-1.0.1.exe' --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload desktop package' }
