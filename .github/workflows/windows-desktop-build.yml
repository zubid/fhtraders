name: Windows Desktop Build
on:
  pull_request:
    paths:
      - "electron/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-desktop-build.yml"
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build web bundle
        run: bun run build
      - name: Rebuild native Electron dependencies
        run: bunx electron-builder install-app-deps
      - name: Run offline SQLite smoke test
        run: node scripts/offline-smoke.cjs
      - name: Build Windows installer
        run: bunx electron-builder --win --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: fh-traders-windows
          path: release/**
          if-no-files-found: error
