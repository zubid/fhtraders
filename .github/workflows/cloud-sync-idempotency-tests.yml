name: Cloud Sync Idempotency PostgreSQL Tests
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/test-sync-operation-guard.sql"
      - "scripts/test-sync-operation-update-guard.sql"
      - ".github/workflows/cloud-sync-idempotency-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/test-sync-operation-guard.sql"
      - "scripts/test-sync-operation-update-guard.sql"
      - ".github/workflows/cloud-sync-idempotency-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-trigger-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify applied sync operation guard on PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d sync_test -v ON_ERROR_STOP=1 -f scripts/test-sync-operation-guard.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sync_update_test'
          psql -h localhost -U postgres -d sync_update_test -v ON_ERROR_STOP=1 -f scripts/test-sync-operation-update-guard.sql
